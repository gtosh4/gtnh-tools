[package]
name = "gtnh-repository"
version = "0.1.0"
edition = "2024"

[lib]
name = "gtnh"
path = "src/lib.rs"

[[bin]]
name = "gtnh"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
rayon = "1"
